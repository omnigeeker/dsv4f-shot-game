<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>废弃基地 — 战术射击</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Three.js 渲染容器 -->
  <div id="game"></div>

  <!-- ========== HUD ========== -->
  <div id="hud" class="hidden">

    <!-- 动态准星 -->
    <div id="crosshair">
      <span class="ch-bar ch-top"></span>
      <span class="ch-bar ch-bottom"></span>
      <span class="ch-bar ch-left"></span>
      <span class="ch-bar ch-right"></span>
      <span id="ch-dot"></span>
    </div>

    <!-- 命中标记 -->
    <div id="hitmarker">
      <span class="hm hm-tl"></span>
      <span class="hm hm-tr"></span>
      <span class="hm hm-bl"></span>
      <span class="hm hm-br"></span>
    </div>

    <!-- 受伤红色渐变 -->
    <div id="damage-vignette"></div>
    <!-- 受伤方向指示 -->
    <div id="damage-dir"></div>

    <!-- 左下：状态 -->
    <div id="status">
      <div class="stat-block">
        <div class="stat-label">HP</div>
        <div class="bar" id="hp-bar"><div id="hp-fill" class="bar-fill"></div></div>
        <div class="stat-num" id="hp-num">100</div>
      </div>
      <div class="stat-block">
        <div class="stat-label">ARMOR</div>
        <div class="bar bar-thin" id="armor-bar"><div id="armor-fill" class="bar-fill armor"></div></div>
        <div class="stat-num" id="armor-num">50</div>
      </div>
    </div>

    <!-- 右下：弹药 -->
    <div id="ammo">
      <div id="ammo-mag">30</div>
      <div id="ammo-reserve">/ 90</div>
    </div>
    <div id="weapon-name">AK-47</div>

    <!-- 顶部中央：波次 -->
    <div id="wave-banner">WAVE 1</div>
    <div id="wave-timer">下一波：00:15</div>

    <!-- 右上：击杀播报 -->
    <div id="killfeed"></div>

    <!-- 左上：战绩 -->
    <div id="score">
      <span id="kills-num">0</span> 击杀
      <span class="score-sep">·</span>
      <span id="wave-num">1</span> 波
    </div>

    <!-- 小地图 -->
    <div id="minimap-wrap">
      <canvas id="minimap-canvas" width="180" height="180"></canvas>
    </div>

    <!-- 枪口红光 / 低血量警告 -->
    <div id="lowhp"></div>

    <!-- 武器槽位 -->
    <div id="weapon-slots"></div>

    <!-- 任务目标（剧情模式） -->
    <div id="mission-hud" class="hidden">
      <div id="mission-title"></div>
      <div id="mission-bar"><div id="mission-fill"></div></div>
      <div id="mission-progress"></div>
    </div>
    <div id="checkpoint-toast" class="hidden">检查点已激活</div>
  </div>

  <!-- ========== 狙击镜 ========== -->
  <div id="scope" class="hidden">
    <div class="scope-ring"></div>
    <div class="scope-cross v"></div>
    <div class="scope-cross h"></div>
    <div class="scope-tick t"></div>
    <div class="scope-tick b"></div>
    <div class="scope-tick l"></div>
    <div class="scope-tick r"></div>
  </div>

  <!-- ========== 开始界面 ========== -->
  <div id="menu" class="overlay">
    <div class="menu-box">
      <div class="menu-kicker">SECURE THE SITE</div>
      <h1 class="menu-title">废 弃 基 地</h1>
      <div class="menu-subtitle">ABANDONED MILITARY BASE · 战术射击</div>
      <p class="briefing">
        恐怖分子已占领多处据点。<br>
        选择模式，消灭所有敌人，活下去。
      </p>

      <!-- 模式切换 -->
      <div id="mode-tabs">
        <button class="mode-tab" data-mode="campaign">剧情模式</button>
        <button class="mode-tab active" data-mode="arena">场景模式</button>
      </div>

      <!-- 场景模式（原地图选择） -->
      <div id="arena-panel">
        <div class="map-select-title">选 择 作 战 场 景</div>
        <div id="map-select"></div>
        <button id="start-btn" class="menu-btn">进入战场</button>
      </div>

      <!-- 剧情模式 -->
      <div id="campaign-panel" class="hidden">
        <div class="map-select-title">选 择 难 度</div>
        <div id="difficulty-select">
          <button class="diff-btn active" data-diff="1">普通</button>
          <button class="diff-btn" data-diff="1.5">困难</button>
        </div>
        <div class="map-select-title">选 择 关 卡</div>
        <div id="level-grid"></div>
        <button id="continue-btn" class="menu-btn ghost hidden">从检查点继续</button>
        <button id="campaign-back" class="menu-btn ghost">返回</button>
      </div>

      <div class="controls-hint">
        <span><b>WASD</b> 移动</span><span><b>Shift</b> 疾跑</span><span><b>Space</b> 跳跃</span>
        <span><b>C</b> 下蹲(更稳)</span><span><b>鼠标</b> 射击</span><span><b>R</b> 换弹</span>
        <span><b>1-5</b> 切枪</span><span><b>右键</b> 狙击开镜</span>
      </div>
    </div>
  </div>

  <!-- ========== 剧情胜利 ========== -->
  <div id="victory" class="overlay hidden">
    <div class="menu-box small">
      <h2 class="menu-title small victory-title">任 务 完 成</h2>
      <div id="victory-info"></div>
      <button id="next-level-btn" class="menu-btn">下一关</button>
      <button id="victory-menu-btn" class="menu-btn ghost">返回主菜单</button>
    </div>
  </div>

  <!-- ========== 暂停 ========== -->
  <div id="pause" class="overlay hidden">
    <div class="menu-box small">
      <h2 class="menu-title small">已 暂 停</h2>
      <button id="resume-btn" class="menu-btn">继续作战</button>
      <button id="restart-btn-pause" class="menu-btn ghost">重新开始</button>
    </div>
  </div>

  <!-- ========== 阵亡结算 ========== -->
  <div id="death" class="overlay hidden">
    <div class="menu-box small">
      <h2 class="menu-title small danger">阵 亡</h2>
      <div id="death-stats"></div>
      <button id="restart-btn" class="menu-btn">重新出击</button>
    </div>
  </div>

  <!-- Three.js 模块映射（CDN，r160） -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
